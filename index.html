<script>
// Parser del reporte "PROFUNDIDAD INVENTARIO - TIENDAS" (GSTPROFUND_TDAS_*.txt)
function createParser(keepLocal,homeLocal){
  const dict=[], dmap=new Map();
  const D=s=>{s=(s==null?'':String(s)).trim(); let i=dmap.get(s); if(i===undefined){i=dict.length;dict.push(s);dmap.set(s,i);} return i;};
  const stores=[], smap=new Map();
  const S=s=>{s=s.trim(); let i=smap.get(s); if(i===undefined){i=stores.length;stores.push(s);smap.set(s,i);} return i;};
  const prods=new Map();
  const meta={empresa:'',reporte:'',divisiones:[],fechaImpresion:'',rango:'',semanas:[],archivos:[]};
  const n=v=>{v=(v||'').trim(); if(!v) return 0; const x=parseFloat(v); return isFinite(x)?Math.round(x*1000)/1000:0;};
  let lineNo=0;
  function line(l){
    lineNo++;
    if(l.endsWith('\r')) l=l.slice(0,-1);
    const c=l.split('\t');
    if(c.length<45){
      if(lineNo<=2 && l.trim() && !meta.empresa) meta.empresa=l.trim();

// Para cada pasillo y clase, toma la última recorrida cerrada que cubrió esa clase.
function latestByClass(days){const lim=days?Date.now()-days*864e5:0;const m=new Map();
  for(const r of S.recs()){if(r.open||r.end<lim)continue;for(const c of r.classes){const k=r.aisleId+'|'+c;const o=m.get(k);if(!o||o.end<r.end)m.set(k,r);}}return m;}
function pending(days){const L=latestByClass(days);const out=[];
  for(const a of S.aisles()){if(a.active===false)continue;for(const c of a.cats){const r=L.get(a.id+'|'+c);if(!r)continue;
    for(const f of r.falt)if(f.c===c&&f.oh>0&&!isRep(r,f.s)&&!XSET.has(String(f.s)))out.push({a,c,r,f});}}return out;}

function retDays(cla,vida){const r=retRule(cla);if(r)return r[0];const v=VIDA.find(x=>x[0]===vida);return v?v[2]:null;}
const lotAnt=l=>l.ant!=null?l.ant:(retDays(l.cla,claVida(sclOf(PR[BYSKU.get(String(l.sku))])||l.cla))??QS.cfg().ant);
const retDate=(fv,ant)=>{const [y,m,d]=fv.split('-').map(Number);return dayStr(new Date(y,m-1,d-ant));};
function lotState(l){const c=QS.cfg(),n=daysTo(l.fv),a=lotAnt(l);if(l.status==='retirado')return 'ret';if(n<0)return 'venc';if(n<=a)return 'retirar';if(n<=a+c.prox)return 'prox';return 'ok';}
function qCounts(){const L=QS.lots().filter(l=>l.status!=='retirado');const o={venc:0,retirar:0,prox:0,ok:0};for(const l of L)o[lotState(l)]++;o.now=o.venc+o.retirar;o.act=L.length;return o;}

function lotRow(l,btn=true){const n=daysTo(l.fv),st=lotState(l);const col=st==='venc'||st==='retirar'?'#dc2626':st==='prox'?'#ea580c':'#16a34a';
  const txt=(st==='ret'?'retirado '+fdt(l.retAt)+' por '+esc(l.retBy||''):n<0?'venció hace '+(-n)+' día(s)':n===0?'vence HOY':'vence en '+n+' día(s)')+(st!=='ret'?' · retiro '+fdate(retDate(l.fv,lotAnt(l)))+(st==='retirar'?' ⚠️ RETIRAR':''):'');

function groupLots(L,btn){if(!L.length)return '<div class="empty">Nada por aquí 🎉</div>';const g=new Map();
  for(const l of L){const k=l.aisleName||'Sin pasillo';if(!g.has(k))g.set(k,new Map());const m=g.get(k);if(!m.has(l.cla))m.set(l.cla,[]);m.get(l.cla).push(l);}
  let h='';for(const[a,m]of g){h+=`<div class="sec">${esc(a)}</div><div class="card" style="padding:6px 10px">`;for(const[c,ls]of m){h+=`<div class="clsH"><span>${esc(short(c))}</span><span>${ls.length}</span></div>`+ls.sort((x,y)=>x.fv.localeCompare(y.fv)).map(l=>lotRow(l,btn)).join('');}h+='</div>';}return h;}

function dataSheet(){const fi=(DB.meta.fechaImpresion||'');
  const sh=sheet(`<h2>Datos de stock</h2><div class="card sub"><b>${esc(DB.meta.empresa)}</b> — ${esc(DB.meta.reporte)}<br>${esc(DB.meta.rango)} (${DAYS} días)<br>Impreso: ${esc(fi)}<br>Archivos: ${esc((DB.meta.archivos||[]).join(', '))}${DB.meta.divFecha?'<br>Por división: '+Object.entries(DB.meta.divFecha).sort().map(([k,v])=>esc(k)+' '+esc(String(v).split(' ')[0])).join(' · '):''}<br>${fmt(PR.length)} productos en ${esc(HOME_LOCAL)}</div>
  ${isAdmin()?`<div class="card"><b>Actualizar stock</b><div class="sub">Elige los archivos GSTPROFUND_TDAS del día (.txt o .txt.gz). Puedes cargar todos juntos o por partes: solo se reemplazan las divisiones que cargas (por ejemplo J01) y las demás se mantienen. Con la sincronización activa, el stock nuevo pasa solo a todos los celulares.</div><button class="btn pri" id="dImp" style="margin-top:10px">Cargar reportes</button><div class="sub" id="dMsg" style="margin-top:8px"></div><button class="btn sm" id="dReset" style="margin-top:6px">Volver a los datos incluidos</button></div>`:''}`);
  const i=sh.querySelector('#dImp');if(i){i.onclick=()=>$('#fileRep').click();sh.querySelector('#dReset').onclick=async()=>{await idbDel('db');setDB(await loadEmbedded());toast('Datos incluidos restaurados','ok');sh.remove();go(VIEW);};}}
$('#fileRep').onchange=async e=>{const files=[...e.target.files];e.target.value='';if(!files.length)return;const msg=t=>{const m=$('#dMsg');if(m)m.textContent=t;};const Pz=createParser(keepLocal,HOME_LOCAL);
  try{for(const f of files){Pz.meta.archivos.push(f.name.replace(/\.gz$/,''));msg('Procesando '+f.name+'…');let s=f.stream();
    const h=new Uint8Array(await f.slice(0,2).arrayBuffer());if(h[0]===0x1f&&h[1]===0x8b)s=s.pipeThrough(new DecompressionStream('gzip'));
    const rd=s.pipeThrough(new TextDecoderStream('windows-1252')).getReader();let buf='';
    for(;;){const{value,done}=await rd.read();if(done)break;buf+=value;let i;while((i=buf.indexOf('\n'))>=0){Pz.line(buf.slice(0,i));buf=buf.slice(i+1);}}if(buf)Pz.line(buf);}
    const db0=Pz.result();if(!db0.products.length)throw new Error('No se encontraron filas de '+HOME_LOCAL);const db=mergeDB(DB,db0);await idbSet('db',db);setDB(db);const MR=db.meta._merge;msg('Listo: '+fmt(PR.length)+' productos. Actualizadas: '+MR.upd.join(', ')+'.'+(MR.kept.length?' Se mantienen de la carga anterior: '+MR.kept.join(', ')+'.':''));toast('Stock actualizado','ok');if(syncUrl()){LS.set('stockPend',Date.now());msg('Listo: '+fmt(PR.length)+' productos. Enviando a los demás celulares…');try{await pushStock();msg('Listo: '+fmt(PR.length)+' productos. Ya se envió a todos los celulares.');}catch(e2){msg('Listo en este celular. Se enviará a los demás apenas haya conexión.');}syncBadge();}
  }catch(err){msg('Error: '+err.message);toast('Error al cargar','err');}};

function assign(id){const L=S.aisles();const a=L.find(x=>x.id===id);const sel=new Set(a.cats);
  const used=new Map();for(const o of L)if(o.id!==id)for(const c of o.cats)used.set(c,o.name);
  const cnt=cs=>cs.reduce((s,c)=>s+(CLS_CNT.get(c)||0),0);
  const clsOf={div:new Map(),dep:new Map(),sub:new Map()};
  let h='';for(const div of srt(TREE.keys())){const D=TREE.get(div);const dc=[];let hd='';
    for(const dep of srt(D.keys())){const Sb=D.get(dep);const pc=[];let hp='';
      for(const sub of srt(Sb.keys())){const C=srt(Sb.get(sub));pc.push(...C);clsOf.sub.set(sub,C);

function faltList(L,r){L=L.filter(f=>!XSET.has(String(f.s)));if(!L.length)return '<div class="empty">Nada por reponer 🎉</div>';L=sortFalt(L);let h='',cur=null;const cnt={};L.forEach(f=>cnt[f.c]=(cnt[f.c]||0)+1);

function recText(r){const pnd=sortFalt(pendOf(r));let cur=null;
  let t=`🛒 *${r.aisleName.replace(/ - .*/,'')}*${r.cls?' · '+recLbl(r):''} — ${r.userName.split(' ')[0]} ${fdt(Date.now())}\n`;
  t+=`\n*Faltantes por reponer (${pnd.length})*\n`;if(!pnd.length)t+='Sin faltantes ✓\n';

  const cn=$('#rCsvN');if(cn)cn.onclick=()=>{const L=catScope().filter(x=>x.oh<0&&!negExcl(x)).sort((a,b)=>a.oh*a.cto-b.oh*b.cto);csvDownload('oh_negativos_'+HOME_LOCAL+'.csv',[['Division','Departamento','Clase','SKU','GTIN','Descripcion','OH','Costo unit','Valor'],...L.map(x=>[x.div,x.dep,x.cla,x.sku,x.gtin,x.desc,x.oh,x.cto,(x.oh*x.cto).toFixed(2)])]);};}
function idC(x,sku){x=x||{};sku=String(sku||x.sku||'');return `${x.marca?'<b>'+esc(x.marca)+'</b> · ':''}GTIN ${esc(x.gtin||'-')} · <span data-cp="${esc(sku)}" style="display:inline-block;background:#dbeafe;color:#1e40af;border-radius:6px;padding:1px 6px;font-weight:700;cursor:pointer">SKU ${esc(sku)} 📋</span>`;}
function itRow(x,right,ohBig){if(ohBig)return `<div class="it" data-sku="${esc(x.sku)}"><div class="grow"><div class="d">${esc(x.desc)}</div><div class="c"><b>${esc(divCode(x.div))}</b> · ${idC(x,x.sku)} · ${esc(short(x.cla))} · vende ${fmt(x.vel,1)} un/día</div></div><div style="text-align:right;margin-left:8px;flex:none"><div style="font-size:20px;font-weight:700;color:var(--red);line-height:1.1">OH ${fmt(x.oh)}</div><div style="font-size:12px;color:var(--mut)">${esc(right)}</div></div></div>`;return `<div class="it" data-sku="${esc(x.sku)}"><div class="grow"><div class="d">${esc(x.desc)}</div><div class="c"><b>${esc(divCode(x.div))}</b> · ${idC(x,x.sku)} · ${esc(short(x.cla))} · OH ${fmt(x.oh)} · vende ${fmt(x.vel,1)} un/día</div></div><span class="oh ${x.oh>0?'':'z'}">${esc(right)}</span></div>`;}

/* ================= arranque ================= */
(async()=>{try{const hm=location.hash.match(/[#&]s=([^&]+)/);if(hm){LS.set('syncUrl',decodeURIComponent(hm[1]));LS.set('syncSince',0);history.replaceState(null,'',location.pathname+location.search);}
  xsRef();const BTS=+'__BUILDTS__'||0;let db=LS.get('stockUpd',0)<BTS?null:await idbGet('db');if(!db){db=await loadEmbedded();if(db){await idbSet('db',db);LS.set('stockUpd',Math.max(LS.get('stockUpd',0),BTS));}}if(!db&&syncUrl()){document.body.insertAdjacentHTML('beforeend','<div id="dlw" style="position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:99;font:16px system-ui;padding:30px;text-align:center">Descargando datos de la tienda…<br>la primera vez puede tardar unos segundos</div>');
    const r=await fetch(syncUrl()+(syncUrl().includes('?')?'&':'?')+'since=0');const j=await r.json();const st=(j.items||[]).filter(x=>x.k==='d'&&x.id==='stock').sort((a,b)=>b.upd-a.upd)[0];
    if(st&&st.d){db=await unB64(st.d);await idbSet('db',db);LS.set('stockUpd',st.upd);}
    const rest=(j.items||[]).filter(x=>x.k!=='d');if(rest.length)applyRemote(rest);const w=$('#dlw');if(w)w.remove();}
  if(!db)throw new Error(syncUrl()?'no hay stock cargado en la hoja':'abre el link completo que te compartió el administrador');setDB(db);
  const me=LS.get('me',null);const u=me&&S.users().find(x=>x.id===me&&!x.off);if(u){ME=u;startApp();}else showLogin();}
  catch(e){document.body.innerHTML='<div style="padding:30px">Error al cargar los datos: '+esc(e.message)+'</div>';}})();
</script>
