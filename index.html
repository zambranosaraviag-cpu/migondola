<script>
// Parser del reporte "PROFUNDIDAD INVENTARIO - TIENDAS" (GSTPROFUND_TDAS_*.txt)
function createParser(keepLocal,homeLocal){
  const dict=[], dmap=new Map();
  const D=s=>{s=(s==null?'':String(s)).trim(); let i=dmap.get(s); if(i===undefined){i=dict.length;dict.push(s);dmap.set(s,i);} return i;};
  const stores=[], smap=new Map();
  const S=s=>{s=s.trim(); let i=smap.get(s); if(i===undefined){i=stores.length;stores.push(s);smap.set(s,i);} return i;};
  const prods=new Map();
  const meta={empresa:'',reporte:'',divisiones:[],fechaImpresion:'',rango:'',semanas:[],archivos:[]};
  const n=v=>{v=(v||'').trim(); if(!v) return 0; const x=parseFloat(v); return isFinite(x)?Math.round(x*1000)/1000:0;};
  let lineNo=0;
  function line(l){
    lineNo++;
    if(l.endsWith('\r')) l=l.slice(0,-1);
    const c=l.split('\t');
    if(c.length<45){
      if(lineNo<=2 && l.trim() && !meta.empresa) meta.empresa=l.trim();
      else if(l.startsWith('PROFUNDIDAD')) meta.reporte=l.trim();
      else if(c[0]==='Division'){ if(c[1] && !meta.divisiones.includes(c[1].trim())) meta.divisiones.push(c[1].trim()); const fi=c.indexOf('Fecha Impresion'); if(fi>=0) meta.fechaImpresion=(c[fi+1]||'').trim(); }
      else if(l.startsWith('Ventas del')) meta.rango=l.trim();
      return;
    }
    if(c[0]==='Local'){ meta.semanas=c.slice(38,43).map(s=>s.replace('Und.Vts','').trim()); return; }
    if(keepLocal && !keepLocal(c[0].trim())) return;
    const sku=c[9].trim(); if(!sku) return;

function profOld(){const df=DB&&DB.meta&&DB.meta.divFecha;if(!df)return [];const v=Object.values(df);const top=v.sort((a,b)=>pdF(b)-pdF(a))[0];return Object.keys(df).filter(k=>pdF(df[k])<pdF(top)).sort();}
function pdF(s){const m=String(s||'').match(/(\d{1,2})-(\d{1,2})-0?(\d{2,4})/);if(!m)return 0;let y=+m[3];if(y<100)y+=2000;return new Date(y,m[2]-1,+m[1]).getTime();}
function profBanner(){const p=profInfo();if(!p)return '';const OLD=profOld();
  if(p.age<1&&OLD.length)return `<div class="card" style="background:#fef3c7;border:1px solid #fcd34d;color:#92400e"><b>⚠️ PROF de hoy cargada solo en parte</b><div style="font-size:13px;margin-top:4px">Siguen con la PROF anterior: <b>${OLD.join(', ')}</b>.${isAdmin()?' Carga esos archivos para tener todo al día.':''}</div>${isAdmin()?'<button class="btn pri sm" data-profimp="1" style="margin-top:10px">⇡ Cargar las que faltan</button>':''}</div>`;
  if(p.age<1)return `<div class="sub" style="margin:2px 2px 8px;color:var(--g)">📦 PROF del ${p.txt} (hoy) ✓</div>`;
  return `<div class="card" style="background:#fee2e2;border:1px solid #fca5a5;color:#991b1b"><b>⚠️ La PROF es del ${p.txt}${p.age>1?' (hace '+p.age+' días)':' (de ayer)'}</b><div style="font-size:13px;margin-top:4px">${isAdmin()?'Carga la de hoy para que el OH esté al día.':'El stock puede no estar al día. Avísale a tu administrador que cargue la PROF de hoy.'}</div><div class="row" style="gap:6px;flex-wrap:wrap;margin-top:10px"><button class="btn sm ${isAdmin()?'':'pri'}" data-pull="1">↻ Buscar PROF nueva</button>${isAdmin()?'<button class="btn pri sm" data-profimp="1">⇡ Cargar PROF de hoy</button>':''}</div></div>`;}

// Para cada pasillo y clase, toma la última recorrida cerrada que cubrió esa clase.
function latestByClass(days){const lim=days?Date.now()-days*864e5:0;const m=new Map();
  for(const r of S.recs()){if(r.open||r.end<lim)continue;for(const c of r.classes){const k=r.aisleId+'|'+c;const o=m.get(k);if(!o||o.end<r.end)m.set(k,r);}}return m;}
function pending(days){const L=latestByClass(days);const out=[];
  for(const a of S.aisles()){if(a.active===false)continue;for(const c of a.cats){const r=L.get(a.id+'|'+c);if(!r)continue;
    for(const f of r.falt)if(f.c===c&&f.oh>0&&!isRep(r,f.s)&&!XSET.has(String(f.s)))out.push({a,c,r,f});}}return out;}

let MODE=LS.get('mode','osa'),QREV=null;
const QS={lots:()=>LS.get('lots',[]),setLots:l=>{track('l',QS.lots(),l);LS.set('lots',l);},revs:()=>LS.get('qrevs',[]),setRevs:r=>{r=r.slice(0,800);track('q',QS.revs(),r);LS.set('qrevs',r);},
  cfg:()=>(LS.get('qcfg',[])[0]||{id:'cal',ant:2,prox:7}),setCfg:c=>{c.upd=Date.now();const L=[c];track('g',LS.get('qcfg',[]),L);LS.set('qcfg',L);}};
const dayStr=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');};
const daysTo=fv=>{const [y,m,d]=fv.split('-').map(Number);const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(y,m-1,d)-t)/864e5);};
const fdate=fv=>{const [y,m,d]=fv.split('-');return d+'/'+m+'/'+y;};
function lotState(l){const c=QS.cfg(),n=daysTo(l.fv);if(l.status==='retirado')return 'ret';if(n<0)return 'venc';if(n<=c.ant)return 'retirar';if(n<=c.ant+c.prox)return 'prox';return 'ok';}
function qCounts(){const L=QS.lots().filter(l=>l.status!=='retirado');const o={venc:0,retirar:0,prox:0,ok:0};for(const l of L)o[lotState(l)]++;o.now=o.venc+o.retirar;o.act=L.length;return o;}

function lotRow(l,btn=true){const n=daysTo(l.fv),st=lotState(l);const col=st==='venc'||st==='retirar'?'#dc2626':st==='prox'?'#ea580c':'#16a34a';

function groupLots(L,btn){if(!L.length)return '<div class="empty">Nada por aquí 🎉</div>';const g=new Map();
  for(const l of L){const k=l.aisleName||'Sin pasillo';if(!g.has(k))g.set(k,new Map());const m=g.get(k);if(!m.has(l.cla))m.set(l.cla,[]);m.get(l.cla).push(l);}

function splitN(L,N){const n=L.length;if(n<=N)return L.map((x,i)=>[x]);const pre=[0];for(const x of L)pre.push(pre[pre.length-1]+x.n);
  const INF=1e15,dp=[...Array(N+1)].map(()=>Array(n+1).fill(INF)),cut=[...Array(N+1)].map(()=>Array(n+1).fill(0));dp[0][0]=0;

const divCode=d=>String(d||'').split('-')[0];
const RCH1=[['pasillo','Pasillo'],['repo','Reposición'],['rank','Ranking faltantes'],['users','Usuarios'],['dias','Días'],['comp','Comparativa'],['evo','Evolución clase']];
const RCH2=[['cob','Cobertura stock'],['sinrot','Sin rotación'],['neg','OH negativos'],['camino','En camino'],['sug','Sugeridos'],['valor','Valor stock'],['prov','Proveedores'],['tend','Tendencia clases']];
const RGRP=[['pis','📷 Pistoleo',RCH1,'Recorridas, faltantes y reposición'],['stk','📦 Stock',RCH2.slice(0,6),'Stock y ventas del reporte GSTPROFUND'],['cat','🏷️ Catálogo',RCH2.slice(6),'Proveedores y tendencia de clases (semanas del reporte)']];
function vRep(k){if(k)RP=k;const A=S.aisles();if(!RA&&A.length)RA=A[0].id;
  const chips=L=>`<div class="chips">${L.map(([k,l])=>`<button class="chip ${RP===k?'on':''}" data-rp="${k}">${l}</button>`).join('')}</div>`;
  const G=RGRP.find(g=>g[2].some(([k])=>k===RP))||RGRP[0];
  $('#main').innerHTML=`<h1>Reportes</h1><div class="seg" style="display:flex;gap:6px;margin:6px 0 4px">${RGRP.map(g=>`<button class="btn sm ${g===G?'pri':''}" data-rg="${g[0]}" style="flex:1">${g[1]}</button>`).join('')}</div>
   <div class="sub" style="margin:4px 2px">${G[3]}</div>${chips(G[2])}<div id="rBody"></div>`;
  $$('[data-rg]').forEach(b=>b.onclick=()=>{const g=RGRP.find(x=>x[0]===b.dataset.rg);vRep(g[2][0][0]);});
  $$('[data-rp]').forEach(b=>b.onclick=()=>vRep(b.dataset.rp));repBody();}
const perSel=()=>`<label class="f">Recorridas de</label><select class="sel" id="rD">${[[1,'Hoy'],[7,'Últimos 7 días'],[30,'Últimos 30 días'],[0,'Todo']].map(([v,l])=>`<option value="${v}" ${RD===v?'selected':''}>${l}</option>`).join('')}</select>`;
const aisSel=(all)=>`<label class="f">Pasillo</label><select class="sel" id="${all?'rA2':'rA'}">${all?'<option value="">Todos</option>':''}${S.aisles().map(a=>`<option value="${a.id}" ${(all?RA2:RA)===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>`;
function bindSel(){const d=$('#rD');if(d)d.onchange=()=>{RD=+d.value;repBody();};const a=$('#rA');if(a)a.onchange=()=>{RA=a.value;RC='';repBody();};const a2=$('#rA2');if(a2)a2.onchange=()=>{RA2=a2.value;repBody();};$$('[data-dv]').forEach(b=>b.onclick=()=>{const d=b.dataset.dv;if(!d)RDV=[];else RDV=RDV.includes(d)?RDV.filter(x=>x!==d):[...RDV,d];repBody();});const c=$('#rC');if(c)c.onchange=()=>{RC=c.value;repBody();};}
function recsIn(days){const lim=days?Date.now()-days*864e5:0;return S.recs().filter(r=>!r.open&&r.end>=lim);}
const catScope=()=>{const a=S.aisles().find(x=>x.id===RA2);let L=a&&RP!=='prov'?PR.filter(x=>a.cats.includes(x.cla)):PR;if(RDV.length&&RP!=='prov')L=L.filter(x=>RDV.includes(x.div));return L;};
const divSel=()=>`<label class="f">División (toca para marcar una o varias)</label><div class="row" style="flex-wrap:wrap;gap:6px"><button class="btn sm ${RDV.length?'':'pri'}" data-dv="">Todas</button>${[...new Set(PR.map(x=>x.div))].sort().map(d=>`<button class="btn sm ${RDV.includes(d)?'pri':''}" data-dv="${esc(d)}" title="${esc(d)}">${esc(divCode(d))} ${esc(short(d).slice(0,14).toLowerCase())}</button>`).join('')}</div>`;
function repBody(){const B=$('#rBody');const A=S.aisles();let h='';
  const need=['pasillo','evo'].includes(RP)&&!A.length;if(need){B.innerHTML='<div class="card empty">Primero crea pasillos y haz recorridas.</div>';return;}
  if(RP==='pasillo'){const a=A.find(x=>x.id===RA)||A[0];RA=a.id;const L=latestByClass(RD);const rows=[];let pres=0,rep=0,tot=0;
    for(const c of srt(a.cats)){const n=CLS_CNT.get(c)||0;if(!n)continue;const r=L.get(a.id+'|'+c);
      if(!r){rows.push({c,n,r:null});continue;}const F=r.falt.filter(f=>f.c===c);const al=F.filter(f=>f.oh>0);const withStock=planOf({cats:[c]}).filter(x=>x.oh>0).length;const p=Math.max(0,withStock-al.length);
      pres+=p;rep+=al.length;tot+=withStock;rows.push({c,n,r,p,al,ws:withStock});}
    const nr=rows.filter(x=>!x.r).length;const cob=tot?Math.round(pres/tot*100):0;
    h=`<div class="card"><div class="row"><div class="grow">${aisSel(false)}</div><div class="grow">${perSel()}</div></div><div class="sub" style="margin-top:8px">Une todas las recorridas cerradas del pasillo en el período: sirve para ver el pasillo completo cuando lo recorriste clase por clase. Solo considera productos con stock en almacén (OH &gt; 0).</div></div>
    <div class="card"><b>Reporte de ${esc(a.name)}</b><div class="sub">${new Set([...L.values()].filter(r=>r.aisleId===a.id).map(r=>r.id)).size} recorrida(s) cerrada(s) · ${nr} clase(s) sin recorrer</div>
     <div class="kp3" style="margin-top:8px"><div class="kpi" style="background:#f6f7f6"><div class="v">${pres}</div><div class="l">presentes</div></div><div class="kpi" style="background:#f6f7f6"><div class="v" style="color:#e11d48">${rep}</div><div class="l">a reponer</div></div><div class="kpi" style="background:#f6f7f6"><div class="v">${cob}%</div><div class="l">cobertura</div></div></div></div>
    <div class="sec">Cobertura por clase</div><div class="card">${rows.sort((x,y)=>(!!y.r)-(!!x.r)).map(x=>x.r?`<details><summary style="cursor:pointer;padding:6px 0"><div class="row"><div class="grow" style="font-size:13px">${esc(x.c)}</div><span class="sub">${x.p}/${x.ws}</span> <span class="badge r">${x.al.length}</span> <b style="font-size:13px">${x.ws?Math.round(x.p/x.ws*100):100}%</b></div><div class="bar ${x.ws&&x.p/x.ws<.5?'r':''}"><i style="width:${x.ws?x.p/x.ws*100:100}%"></i></div><div class="sub" style="font-size:11px">${fdt(x.r.end)} · ${esc(x.r.userName)}</div></summary>${faltList(x.al)}</details>`:
      `<div class="row" style="padding:6px 0;font-size:13px;color:var(--mut)"><div class="grow">${esc(x.c)}</div>${x.n} · sin recorrer</div>`).join('')}</div>
    <button class="btn sm" id="rCsvP">⇣ CSV</button>`;}
  else if(RP==='repo'){const pend=pending(RD);const by=new Map();for(const p of pend){if(!by.has(p.a.id))by.set(p.a.id,{a:p.a,L:[]});by.get(p.a.id).L.push(p.f);}
    h=`<div class="card">${perSel()}<div class="sub" style="margin-top:8px">Por pasillo y clase, de la última recorrida de cada clase en el período: ${pend.length} producto(s) pendiente(s) en ${by.size} pasillo(s). Toca un pasillo para desglosarlo.</div></div>
    ${A.filter(a=>a.active!==false).map(a=>{const o=by.get(a.id);return `<details class="card"><summary class="row" style="cursor:pointer"><div class="grow"><b>${esc(a.name)}</b> <span class="sub">${esc(a.desc||'')}</span></div>${o?`<span class="badge o">${o.L.length} a reponer</span>`:'<span class="badge off">sin pendientes</span>'}</summary>${o?faltList(o.L.sort((x,y)=>x.c.localeCompare(y.c)||y.v-x.v)):''}</details>`;}).join('')}
    ${pend.length?'<button class="btn sm" id="rCsvR">⇣ CSV</button>':''}`;}
  else if(RP==='rank'){const R=recsIn(RD);const m=new Map();for(const r of R)for(const f of r.falt)if(f.oh>0){const o=m.get(f.s)||{f,n:0};o.n++;o.f=f;m.set(f.s,o);}
    const L=[...m.values()].sort((a,b)=>b.n-a.n||b.f.v-a.f.v).slice(0,60);const mx=L[0]?L[0].n:1;
    h=`<div class="card">${perSel()}<div class="sub" style="margin-top:8px">Productos que más veces quedaron sin exhibir (teniendo stock) en ${R.length} recorrida(s) cerrada(s).</div></div>
    ${L.map((o,i)=>{const x=PR[BYSKU.get(o.f.s)]||{};return `<div class="it" data-sku="${esc(o.f.s)}" style="border-left-color:#e11d48"><div class="grow"><div class="d">#${i+1} ${esc(o.f.d)}</div><div class="bar r"><i style="width:${o.n/mx*100}%"></i></div><div class="c">${esc(short(o.f.c))} · OH ${fmt(x.oh??o.f.oh)}</div></div><span class="badge r">${o.n}×</span></div>`}).join('')||'<div class="card empty">Sin recorridas en el período</div>'}`;}
  else if(RP==='users'){const R=recsIn(RD);const m=new Map();for(const r of R){const o=m.get(r.userId)||{n:r.userName,rc:0,sc:0,rep:0,last:0};o.rc++;o.sc+=Object.keys(r.scans).length;o.rep+=r.falt.filter(f=>f.oh>0).length;o.last=Math.max(o.last,r.end);m.set(r.userId,o);}
    h=`<div class="card">${perSel()}<div class="sub" style="margin-top:8px">Qué hizo cada usuario con sus recorridas cerradas.</div></div>${[...m.values()].sort((a,b)=>b.rc-a.rc).map(o=>`<div class="card"><div class="row"><div class="ic g" style="width:30px;height:30px;border-radius:9px;display:grid;place-items:center">👤</div><div class="grow"><b>${esc(o.n)}</b><div class="sub">última: ${fdt(o.last)}</div></div></div>
     <div class="kp3" style="margin-top:6px;text-align:center"><div><div style="font-size:20px">${o.rc}</div><div class="sub">recorridas</div></div><div><div style="font-size:20px">${fmt(o.sc)}</div><div class="sub">escaneos</div></div><div><div style="font-size:20px;color:#e11d48">${o.rep}</div><div class="sub">a reponer</div></div></div></div>`).join('')||'<div class="card empty">Sin recorridas en el período</div>'}`;}
  else if(RP==='dias'){const R=recsIn(RD||30);const m=new Map();for(const r of R){const k=new Date(r.end).toISOString().slice(0,10);const o=m.get(k)||{k,rc:0,sc:0,rep:0,a:new Set()};o.rc++;o.sc+=Object.keys(r.scans).length;o.rep+=r.falt.filter(f=>f.oh>0).length;o.a.add(r.aisleName);m.set(k,o);}
    const L=[...m.values()].sort((a,b)=>b.k.localeCompare(a.k));const mx=Math.max(1,...L.map(o=>o.sc));
    h=`<div class="card">${perSel()}<div class="sub" style="margin-top:8px">Resumen día por día de todas las recorridas cerradas.</div></div>${L.map(o=>`<div class="card"><div class="row"><div class="grow"><b>${new Date(o.k+'T12:00').toLocaleDateString('es-PE',{weekday:'short',day:'2-digit',month:'2-digit'})}</b> <span class="sub">${o.rc} recorrida(s) · ${esc([...o.a].join(', '))}</span></div><span class="badge">${o.sc} escaneos</span></div><div class="bar"><i style="width:${o.sc/mx*100}%"></i></div><span class="badge o" style="margin-top:6px">${o.rep} a reponer</span></div>`).join('')||'<div class="card empty">Sin recorridas</div>'}`;}
  else if(RP==='comp'){const L=latestByClass(RD);const rows=A.filter(a=>a.active!==false).map(a=>{let ws=0,al=0,cl=0,rec=0;for(const c of a.cats){const r=L.get(a.id+'|'+c);if(!r)continue;rec++;const w=planOf({cats:[c]}).filter(x=>x.oh>0).length;ws+=w;al+=r.falt.filter(f=>f.c===c&&f.oh>0).length;}
      return {a,ws,al,rec,cl:a.cats.length,cob:ws?Math.round((ws-al)/ws*100):null};}).sort((x,y)=>(x.cob??101)-(y.cob??101));
    h=`<div class="card">${perSel()}<div class="sub" style="margin-top:8px">Cobertura de todos los pasillos del período, de un vistazo, peor cobertura primero.</div></div><div class="card">${rows.map(o=>`<div style="padding:8px 0;border-bottom:1px solid var(--ln)"><div class="row"><b class="grow">${esc(o.a.name)}</b>${o.cob==null?'<span class="sub">sin recorridas</span>':`<b>${o.cob}%</b>`}</div>${o.cob==null?'':`<div class="bar ${o.cob<50?'r':''}"><i style="width:${o.cob}%"></i></div><div class="sub" style="font-size:12px">${o.ws-o.al}/${o.ws} presentes · ${o.al} a reponer · ${o.rec}/${o.cl} clases recorridas</div>`}</div>`).join('')}</div>`;}
  else if(RP==='evo'){const a=A.find(x=>x.id===RA)||A[0];RA=a.id;const cls=srt(a.cats).filter(c=>CLS_CNT.get(c));if(!cls.includes(RC))RC=cls[0]||'';
    const R=S.recs().filter(r=>!r.open&&r.aisleId===a.id&&r.classes.includes(RC)).sort((x,y)=>y.end-x.end);
    h=`<div class="card"><div class="row"><div class="grow">${aisSel(false)}</div><div class="grow"><label class="f">Clase</label><select class="sel" id="rC">${cls.map(c=>`<option value="${esc(c)}" ${RC===c?'selected':''}>${esc(c)} (${CLS_CNT.get(c)})</option>`).join('')}</select></div></div><div class="sub" style="margin-top:8px">Cobertura de la clase en cada recorrida, de la más reciente a la más antigua.</div></div>
    ${R.map(r=>{const w=Object.keys(r.scans).filter(k=>{const x=PR[BYSKU.get(k)];return x&&x.cla===RC;}).length;const al=r.falt.filter(f=>f.c===RC&&f.oh>0).length;const ws=w+al;const c=ws?Math.round(w/ws*100):100;
      return `<div class="card"><div class="row"><div class="grow"><b>${fdt(r.end)}</b> <span class="sub">${esc(r.userName)}</span></div><b>${c}%</b></div><div class="bar ${c<50?'r':''}"><i style="width:${c}%"></i></div><div class="sub" style="font-size:12px">${w} presentes · ${al} a reponer</div></div>`;}).join('')||'<div class="card empty">Sin recorridas de esa clase todavía.</div>'}`;}
  else{const X=catScope();const sc=RP==='prov'?'':`<div class="card">${aisSel(true)}${divSel()}</div>`;
    if(RP==='cob'){const L=X.filter(x=>x.act&&x.vel>0).map(x=>({x,c:x.oh/x.vel})).sort((a,b)=>a.c-b.c);const bk=[['Sin stock (0 días)',o=>o.c<=0],['Menos de 7 días',o=>o.c>0&&o.c<7],['7 a 30 días',o=>o.c>=7&&o.c<30],['30 a 90 días',o=>o.c>=30&&o.c<90],['Más de 90 días',o=>o.c>=90]];
      h=sc+`<div class="card"><b>Cobertura de stock</b><div class="sub">Días que dura el stock al ritmo de venta (${fmt(L.length)} productos activos con venta).</div><table class="t" style="margin-top:6px">${bk.map(([l,f])=>`<tr><td>${l}</td><td>${fmt(L.filter(f).length)}</td></tr>`).join('')}</table></div>
      <div class="sec">Menor cobertura con stock (riesgo de quiebre)</div>${L.filter(o=>o.c>0).slice(0,40).map(o=>itRow(o.x,`${fmt(o.c,1)} días`)).join('')}`;}
    else if(RP==='sinrot'){const L=X.filter(x=>x.oh>0&&x.sold===0).sort((a,b)=>b.oh*b.cto-a.oh*a.cto);h=sc+`<div class="card"><b>Sin rotación</b><div class="sub">${fmt(L.length)} producto(s) con stock que no vendieron nada en ${DAYS} días · ${sol(L.reduce((s,x)=>s+x.oh*x.cto,0))} a costo.</div></div>${L.slice(0,80).map(x=>itRow(x,sol(x.oh*x.cto))).join('')}`;}
    else if(RP==='neg'){const L=X.filter(x=>x.oh<0&&!negExcl(x)).sort((a,b)=>a.oh*a.cto-b.oh*b.cto);h=sc+`<div class="card"><b>OH negativos</b> — ${L.length} ajuste(s) pendiente(s) del ERP (sin concesiones, garantía extendida ni operadores). Valor a conciliar: ${sol(-L.reduce((s,x)=>s+x.oh*x.cto,0))}.</div><div class="kp3"><div class="kpi"><div class="v">${L.length}</div><div class="l">productos</div></div><div class="kpi"><div class="v">${fmt(L.reduce((s,x)=>s+x.oh,0))}</div><div class="l">unidades</div></div><div class="kpi"><div class="v">${sol(-L.reduce((s,x)=>s+x.oh*x.cto,0))}</div><div class="l">a conciliar</div></div></div>${(()=>{const g=new Map();for(const d of new Set(X.map(x=>x.div)))g.set(d,{n:0,u:0,v:0});for(const x of L){const o=g.get(x.div)||{n:0,u:0,v:0};o.n++;o.u+=x.oh;o.v+=-x.oh*x.cto;g.set(x.div,o);}return `<div class="card"><b>Por división</b><table class="t" style="margin-top:6px"><tr><td><b>División</b></td><td><b>Prod.</b></td><td><b>Unid.</b></td><td><b>Valor</b></td></tr>${[...g].sort((a,b)=>a[0].localeCompare(b[0])).map(([k,o])=>{const st=o.v>=500?'color:var(--red);font-weight:700':o.v>=200?'color:var(--ora);font-weight:600':'';return `<tr><td>${esc(k)}</td><td>${o.n}</td><td>${fmt(o.u)}</td><td style="${st}">${sol(o.v)}</td></tr>`;}).join('')}<tr><td colspan="4" class="sub" style="font-size:11px"><span style="color:var(--red);font-weight:700">Rojo</span>: S/ 500 o más · <span style="color:var(--ora);font-weight:600">Naranja</span>: S/ 200 a 499</td></tr></table><a id="rCsvN" style="display:block;margin-top:8px;cursor:pointer">⇣ Exportar OH negativos (CSV)</a></div>`;})()}${L.map(x=>itRow(x,sol(x.oh*x.cto),1)).join('')}`;}
    else if(RP==='camino'){const L=X.filter(x=>x.oo>0||x.tr>0).sort((a,b)=>(b.oo+b.tr)-(a.oo+a.tr));h=sc+`<div class="card"><b>En camino</b><div class="sub">${fmt(L.length)} producto(s) con pedido (OO) o transferencia en camino · ${fmt(L.reduce((s,x)=>s+x.oo+x.tr,0))} unidades.</div></div>${L.slice(0,100).map(x=>itRow(x,'OO '+fmt(x.oo+x.tr))).join('')}`;}
    else if(RP==='sug'){const L=X.filter(x=>x.act&&x.vel>0&&!x.oo&&!x.tr&&x.oh/x.vel<7).map(x=>({x,q:Math.max(0,Math.ceil((x.vel*14-Math.max(0,x.oh))/x.cajas)*x.cajas)})).filter(o=>o.q>0).sort((a,b)=>b.x.vel-a.x.vel);
      h=sc+`<div class="card"><b>Pedidos sugeridos</b> — ${L.length} producto(s) con venta, sin OO ni transferencia, y cobertura menor a 1 semana.</div><div class="kp"><div class="kpi"><div class="v">${L.length}</div><div class="l">productos</div></div><div class="kpi"><div class="v">${fmt(L.reduce((s,o)=>s+o.q,0))}</div><div class="l">unidades a pedir</div></div></div><div class="sub" style="margin:6px 2px">Cantidad sugerida: lo que falta para cubrir 2 semanas de venta al ritmo promedio, redondeado a cajas.</div>${L.slice(0,100).map(o=>itRow(o.x,'pedir '+fmt(o.q))).join('')}`;}
    else if(RP==='valor'){const g=new Map();let T=0;for(const x of X){if(x.oh<=0)continue;const v=x.oh*x.cto;T+=v;g.set(x.dep,(g.get(x.dep)||0)+v);}const L=[...g].sort((a,b)=>b[1]-a[1]);
      h=sc+`<div class="card"><b>Valor del stock</b><div class="v" style="font-size:28px">${sol(T)}</div><div class="sub">a costo promedio, sin IGV</div></div><div class="card">${L.map(([k,v])=>`<div style="padding:5px 0"><div class="row" style="font-size:13px"><div class="grow">${esc(k)}</div><b>${sol(v)}</b></div><div class="bar"><i style="width:${v/L[0][1]*100}%"></i></div></div>`).join('')}</div>`;}
    else if(RP==='prov'){const g=new Map();let T=0;for(const x of PR){const o=g.get(x.prov)||{u:0,n:0,oh:0,v:0};o.u+=x.sold;o.n++;o.oh+=Math.max(0,x.oh);o.v+=x.sold*x.pv;g.set(x.prov,o);T+=x.sold;}const L=[...g].sort((a,b)=>b[1].u-a[1].u).slice(0,25);
      h=`<div class="card"><b>Proveedores</b> — ${g.size} proveedores · ${fmt(T)} unidades vendidas en ${DAYS} días · ${sol(L.reduce((s,[,o])=>s+o.v,0))} venta top 25.</div><div class="sec">Top 25 por unidades</div>${L.map(([k,o])=>`<div class="card" style="padding:10px 12px"><div class="row"><div class="grow" style="font-size:13px"><b>${esc(k)}</b></div><span class="sub">${(o.u/T*100).toFixed(1)}%</span> <b>${fmt(o.u)}</b></div><div class="bar"><i style="width:${o.u/L[0][1].u*100}%"></i></div><div class="sub" style="font-size:11px">${o.n} SKU · stock ${fmt(o.oh)} un</div></div>`).join('')}`;}
    else if(RP==='tend'){const g=new Map();for(const x of X){const o=g.get(x.cla)||{a:0,b:0};o.a+=x.w[0];o.b+=x.w[3];g.set(x.cla,o);}const L=[...g].filter(([,o])=>o.a>=20).map(([k,o])=>({k,...o,d:o.b-o.a,p:(o.b-o.a)/o.a})).sort((a,b)=>a.p-b.p);
      h=sc+`<div class="card"><b>Tendencia por clase</b> — ${L.filter(o=>o.d<0).length} clase(s) venden menos en la última semana completa que en la primera.<div class="sub">${esc(DB.meta.semanas[0]||'')} → ${esc(DB.meta.semanas[3]||'')}: suma de unidades vendidas por clase (peores caídas primero).</div></div>
      ${L.slice(0,60).map(o=>`<div class="card" style="padding:10px 12px"><div class="row"><div class="grow"><b style="font-size:13px">${esc(o.k)}</b><div class="sub" style="font-size:11px">${esc(aisleOfClass(o.k).map(a=>a.name).join(', '))} ${fmt(o.a)} → ${fmt(o.b)} un</div></div><b style="color:${o.d<0?'#e11d48':'var(--g)'}">${o.d>0?'+':''}${fmt(o.d)} (${o.p>0?'+':''}${(o.p*100).toFixed(1)}%)</b></div></div>`).join('')}`;}}
  B.innerHTML=h;bindSel();
  const cp=$('#rCsvP');if(cp)cp.onclick=()=>{const L=latestByClass(RD);const a=A.find(x=>x.id===RA);const rows=[['Pasillo','Clase','SKU','Descripcion','OH','Recorrida','Usuario']];for(const c of a.cats){const r=L.get(a.id+'|'+c);if(r)for(const f of r.falt)if(f.c===c&&f.oh>0)rows.push([a.name,c,f.s,f.d,f.oh,fdt(r.end),r.userName]);}csvDownload('reporte_'+a.name+'.csv',rows);};
  const cr=$('#rCsvR');if(cr)cr.onclick=()=>csvPending(pending(RD));
  const cn=$('#rCsvN');if(cn)cn.onclick=()=>{const L=catScope().filter(x=>x.oh<0&&!negExcl(x)).sort((a,b)=>a.oh*a.cto-b.oh*b.cto);csvDownload('oh_negativos_'+HOME_LOCAL+'.csv',[['Division','Departamento','Clase','SKU','GTIN','Descripcion','OH','Costo unit','Valor'],...L.map(x=>[x.div,x.dep,x.cla,x.sku,x.gtin,x.desc,x.oh,x.cto,(x.oh*x.cto).toFixed(2)])]);};}
function idC(x,sku){x=x||{};sku=String(sku||x.sku||'');return `${x.marca?'<b>'+esc(x.marca)+'</b> · ':''}GTIN ${esc(x.gtin||'-')} · <span data-cp="${esc(sku)}" style="display:inline-block;background:#dbeafe;color:#1e40af;border-radius:6px;padding:1px 6px;font-weight:700;cursor:pointer">SKU ${esc(sku)} 📋</span>`;}
function itRow(x,right,ohBig){if(ohBig)return `<div class="it" data-sku="${esc(x.sku)}"><div class="grow"><div class="d">${esc(x.desc)}</div><div class="c"><b>${esc(divCode(x.div))}</b> · ${idC(x,x.sku)} · ${esc(short(x.cla))} · vende ${fmt(x.vel,1)} un/día</div></div><div style="text-align:right;margin-left:8px;flex:none"><div style="font-size:20px;font-weight:700;color:var(--red);line-height:1.1">OH ${fmt(x.oh)}</div><div style="font-size:12px;color:var(--mut)">${esc(right)}</div></div></div>`;return `<div class="it" data-sku="${esc(x.sku)}"><div class="grow"><div class="d">${esc(x.desc)}</div><div class="c"><b>${esc(divCode(x.div))}</b> · ${idC(x,x.sku)} · ${esc(short(x.cla))} · OH ${fmt(x.oh)} · vende ${fmt(x.vel,1)} un/día</div></div><span class="oh ${x.oh>0?'':'z'}">${esc(right)}</span></div>`;}

/* ================= arranque ================= */
(async()=>{try{const hm=location.hash.match(/[#&]s=([^&]+)/);if(hm){LS.set('syncUrl',decodeURIComponent(hm[1]));LS.set('syncSince',0);history.replaceState(null,'',location.pathname+location.search);}
  xsRef();const BTS=+'__BUILDTS__'||0;let db=LS.get('stockUpd',0)<BTS?null:await idbGet('db');if(!db){db=await loadEmbedded();if(db){await idbSet('db',db);LS.set('stockUpd',Math.max(LS.get('stockUpd',0),BTS));}}if(!db&&syncUrl()){document.body.insertAdjacentHTML('beforeend','<div id="dlw" style="position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:99;font:16px system-ui;padding:30px;text-align:center">Descargando datos de la tienda…<br>la primera vez puede tardar unos segundos</div>');
    const r=await fetch(syncUrl()+(syncUrl().includes('?')?'&':'?')+'since=0');const j=await r.json();const st=(j.items||[]).filter(x=>x.k==='d'&&x.id==='stock').sort((a,b)=>b.upd-a.upd)[0];
    if(st&&st.d){db=await unB64(st.d);await idbSet('db',db);LS.set('stockUpd',st.upd);}
    const rest=(j.items||[]).filter(x=>x.k!=='d');if(rest.length)applyRemote(rest);const w=$('#dlw');if(w)w.remove();}
  if(!db)throw new Error(syncUrl()?'no hay stock cargado en la hoja':'abre el link completo que te compartió el administrador');setDB(db);
  const me=LS.get('me',null);const u=me&&S.users().find(x=>x.id===me&&!x.off);if(u){ME=u;startApp();}else showLogin();}
  catch(e){document.body.innerHTML='<div style="padding:30px">Error al cargar los datos: '+esc(e.message)+'</div>';}})();
</script>
