<script>
// Parser del reporte "PROFUNDIDAD INVENTARIO - TIENDAS" (GSTPROFUND_TDAS_*.txt)
function createParser(keepLocal,homeLocal){
  const dict=[], dmap=new Map();
  const D=s=>{s=(s==null?'':String(s)).trim(); let i=dmap.get(s); if(i===undefined){i=dict.length;dict.push(s);dmap.set(s,i);} return i;};
  const stores=[], smap=new Map();
  const S=s=>{s=s.trim(); let i=smap.get(s); if(i===undefined){i=stores.length;stores.push(s);smap.set(s,i);} return i;};
  const prods=new Map();
  const meta={empresa:'',reporte:'',divisiones:[],fechaImpresion:'',rango:'',semanas:[],archivos:[]};
  const n=v=>{v=(v||'').trim(); if(!v) return 0; const x=parseFloat(v); return isFinite(x)?Math.round(x*1000)/1000:0;};
  let lineNo=0;
  function line(l){
    lineNo++;
    if(l.endsWith('\r')) l=l.slice(0,-1);
    const c=l.split('\t');
    if(c.length<45){
      if(lineNo<=2 && l.trim() && !meta.empresa) meta.empresa=l.trim();
      else if(l.startsWith('PROFUNDIDAD')) meta.reporte=l.trim();
      else if(c[0]==='Division'){ if(c[1] && !meta.divisiones.includes(c[1].trim())) meta.divisiones.push(c[1].trim()); const fi=c.indexOf('Fecha Impresion'); if(fi>=0) meta.fechaImpresion=(c[fi+1]||'').trim(); }
      else if(l.startsWith('Ventas del')) meta.rango=l.trim();
      return;
    }
    if(c[0]==='Local'){ meta.semanas=c.slice(38,43).map(s=>s.replace('Und.Vts','').trim()); return; }
    if(keepLocal && !keepLocal(c[0].trim())) return;
    const sku=c[9].trim(); if(!sku) return;
    let p=prods.get(sku);
    if(!p){
      p={f:[c[8].trim(),sku,c[11].trim(),D(c[12]),D(c[1]),D(c[2]),D(c[3]),D(c[4]),D(c[5]),D(c[6]),D(c[7]),D(c[13]),D(c[14]),D(c[16]),n(c[17]),n(c[18]),n(c[20]),n(c[22]),n(c[32]),n(c[33]),D(c[34]),D(c[35]),D(c[36])],r:[]};
      prods.set(sku,p);
    }
    // fila por local: tienda, OH, OO, w1..w5, precioVig, precioReg, prioridad, estado, ofertaIni, ofertaFin, ultRecibo, edad, transferOO, ctoProm
    p.r.push(S(c[0]),n(c[43]),n(c[44]),n(c[38]),n(c[39]),n(c[40]),n(c[41]),n(c[42]),n(c[25]),n(c[22]),D(c[23]),D(c[30]),D(c[26]),D(c[27]),D(c[28]),n(c[29]),n(c[50]),n(c[18]));
  }
  function result(){
    let list=[...prods.values()];
    if(homeLocal){const h=smap.get(homeLocal); list=h===undefined?[]:list.filter(p=>{for(let i=0;i<p.r.length;i+=18) if(p.r[i]===h) return true; return false;});}
    return {v:1,meta,dict,stores,products:list.map(p=>p.f.concat([p.r]))};
  }
  return {line,result,meta};
}
// Configuración de tienda única: 372-Huacho, más CDs y tiendas cercanas para sugerir transferencias
const HOME_LOCAL='372-Huacho';
function keepLocal(name){return parseInt(name)===372;}
if(typeof module!=='undefined') module.exports={createParser,keepLocal,HOME_LOCAL};

</script>
<script>
/* ================= utilidades ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(x,dd=0)=>(x==null||!isFinite(x))?'—':Number(x).toLocaleString('es-PE',{minimumFractionDigits:dd,maximumFractionDigits:dd});
const sol=x=>(x==null||!isFinite(x))?'—':'S/ '+fmt(x,0);
const LS={get:(k,d)=>{try{const v=localStorage.getItem('mg_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>localStorage.setItem('mg_'+k,JSON.stringify(v))};
function toast(t,cls='',ms=2600){if(!$('#fs').classList.contains('hide'))return;const e=document.createElement('div');e.className='toast '+cls;e.textContent=t;$('#toasts').prepend(e);setTimeout(()=>e.remove(),ms);while($('#toasts').children.length>3)$('#toasts').lastChild.remove();}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fdt=t=>{const x=new Date(t);return x.toLocaleDateString('es-PE',{day:'2-digit',month:'2-digit'})+' '+x.toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit',hour12:false});};
const short=s=>String(s).replace(/^\S+?-/,'');
function csvDownload(name,rows){const csv='﻿'+rows.map(r=>r.map(v=>{v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();a.remove();}
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mg372|'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){let h=0;for(const c of 'mg372|'+s)h=(h*31+c.charCodeAt(0))|0;return 'h'+h;}}

/* ================= datos del reporte ================= */
let DB=null, IDX=null, DAYS=29, ST_HOME=0;
const P={gtin:0,sku:1,desc:2,marca:3,div:4,dep:5,sub:6,cla:7,scl:8,proc:9,prov:10,ctoProm:15,precReg:17,case:18,rows:23}, RW=18;
const d=i=>DB.dict[i]??'';
let PR=[]; // productos de la tienda: {i,sku,gtin,desc,marca,div,dep,sub,cla,prov,oh,oo,tr,w,sold,vel,pv,est,act,cto}
let BYSKU=new Map();
function idb(){return new Promise((ok,ko)=>{const r=indexedDB.open('migondolaDB',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error);});}
async function idbGet(k){const db=await idb();return new Promise(ok=>{const t=db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>ok(t.result);t.onerror=()=>ok(null);});}
async function idbSet(k,v){const db=await idb();return new Promise((ok,ko)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=ok;t.onerror=()=>ko(t.error);});}
async function idbDel(k){const db=await idb();return new Promise(ok=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=ok;});}
async function loadEmbedded(){const b64=$('#dbdata').textContent.trim();if(!b64||b64.startsWith('__'))return null;
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));return await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).json();}
const normG=g=>String(g||'').replace(/\D/g,'').replace(/^0+/,'');

  let h='';for(const[a,m]of g){h+=`<div class="sec">${esc(a)}</div><div class="card" style="padding:6px 10px">`;for(const[c,ls]of m){h+=`<div class="clsH"><span>${esc(short(c))}</span><span>${ls.length}</span></div>`+ls.sort((x,y)=>x.fv.localeCompare(y.fv)).map(l=>lotRow(l,btn)).join('');}h+='</div>';}return h;}
function bindRet(after){$$('[data-ret]').forEach(b=>b.onclick=e=>{e.stopPropagation();const L=QS.lots();const l=L.find(x=>x.id===b.dataset.ret);if(!l)return;l.status='retirado';l.retAt=Date.now();l.retBy=ME.name;l.upd=Date.now();QS.setLots(L);toast('Marcado como retirado','ok');after();});
  $$('[data-l]').forEach(e=>e.onclick=()=>lotSheet(e.dataset.l,after));}
function lotSheet(id,after){const L=QS.lots();const l=L.find(x=>x.id===id);if(!l)return;
  const sh=sheet(`<h2>${esc(l.desc)}</h2><div class="sub">${esc(l.aisleName||'')} · ${esc(short(l.cla))} · cargado por ${esc(l.userName||'')} el ${fdt(l.created)}</div>
   <label class="f">Fecha de vencimiento</label><input class="inp" type="date" id="eF" value="${l.fv}"><label class="f">Cantidad (opcional)</label><input class="inp" id="eQ" inputmode="numeric" value="${l.qty||''}">
   <div class="row" style="margin-top:14px">${isAdmin()||l.userId===ME.id?'<button class="btn dan" id="eDel">Borrar</button>':''}<div class="grow"></div>${l.status==='retirado'?'<button class="btn" id="eUn">Deshacer retiro</button>':''}<button class="btn pri" id="eOk">Guardar</button></div>`);
  sh.querySelector('#eOk').onclick=()=>{const f=sh.querySelector('#eF').value;if(!f){toast('Pon la fecha','err');return;}l.fv=f;l.qty=+sh.querySelector('#eQ').value||0;l.upd=Date.now();QS.setLots(L);sh.remove();after();};
  const d=sh.querySelector('#eDel');if(d)d.onclick=()=>{if(!confirm('¿Borrar este registro?'))return;QS.setLots(L.filter(x=>x.id!==id));sh.remove();after();};
  const u=sh.querySelector('#eUn');if(u)u.onclick=()=>{l.status='activo';delete l.retAt;delete l.retBy;l.upd=Date.now();QS.setLots(L);sh.remove();after();};}
function vQHome(){const q=qCounts(),c=QS.cfg();const A=S.aisles().filter(a=>a.active!==false);const R=QS.revs();const today=dayStr(Date.now());
  const last=new Map();for(const r of R){if(r.open)continue;for(const cl of r.classes){const k=r.aisleId+'|'+cl;if(!last.has(k)||last.get(k)<r.end)last.set(k,r.end);}}
  const open=R.find(r=>r.open&&r.userId===ME.id);
  const rows=A.map(a=>{const cls=srt(a.cats).filter(x=>CLS_CNT.get(x));const done=cls.filter(x=>{const t=last.get(a.id+'|'+x);return t&&dayStr(t)===today;}).length;return {a,cls,done};});
  $('#main').innerHTML=`${q.now?`<div class="card" style="background:#fef2f2;border:1px solid #fecaca;cursor:pointer" id="qAl"><b style="color:#dc2626">⚠️ ${q.now} producto(s) para retirar</b><div class="sub">${q.venc} vencido(s) y ${q.retirar} dentro de los ${c.ant} día(s) de anticipación. Toca para verlos.</div></div>`:''}

  ${open?`<div class="card" style="border:1px solid var(--amb)"><b>Revisión abierta:</b> ${esc(open.aisleName)}${open.cls?' · '+esc(short(open.cls)):''}<div class="row" style="margin-top:8px"><button class="btn pri sm" id="qCont">📷 Seguir revisando</button></div></div>`:''}
  <button class="btn pri big" id="qGo">🧪 Revisar fechas de un pasillo</button>
  <div class="sec">Revisado hoy por pasillo</div><div class="card">${rows.map(o=>`<div class="act" data-qa="${o.a.id}"><div class="ic ${o.done===o.cls.length&&o.cls.length?'g':o.done?'y':'r'}">${o.done===o.cls.length&&o.cls.length?'✓':o.done?'½':'·'}</div><div class="grow"><div class="t">${esc(o.a.name)}</div><div class="s">${o.done} de ${o.cls.length} clase(s) revisadas hoy</div></div><div class="ch">›</div></div>`).join('')||'<div class="empty">No hay pasillos.</div>'}</div>
  ${isAdmin()?`<div class="card">${act('⚙️','b','Días de anticipación para retiro: '+c.ant,'Se avisa para retirar '+c.ant+' día(s) antes de la fecha. Próximos: '+c.prox+' días','qCfg')}</div>`:''}`;
  const al=$('#qAl');if(al)al.onclick=()=>go('qalert');$('#qGo').onclick=()=>go('qscan');const qc=$('#qCont');if(qc)qc.onclick=()=>{QREV=open;qScanUI();};
  $$('[data-qa]').forEach(e=>e.onclick=()=>qAisle(e.dataset.qa,last));const cf=$('#qCfg');if(cf)cf.onclick=qCfgSheet;}
function qAisle(aid,last){const a=S.aisles().find(x=>x.id===aid);const cls=srt(a.cats).filter(x=>CLS_CNT.get(x));const lots=QS.lots().filter(l=>l.aisleId===aid&&l.status!=='retirado');
  const sh=sheet(`<h2>${esc(a.name)}</h2><div class="sub">Última revisión de fechas por clase</div><div style="margin-top:8px">${cls.map(c=>{const t=last.get(aid+'|'+c);const n=lots.filter(l=>l.cla===c).length;return `<div class="it"><div class="grow"><div class="d">${esc(short(c))}</div><div class="c">${t?'revisada '+fdt(t):'nunca revisada'}${n?' · '+n+' fecha(s) activa(s)':''}</div></div><button class="btn sm pri" data-qc="${esc(c)}">Revisar</button></div>`;}).join('')}</div>`);
  sh.querySelectorAll('[data-qc]').forEach(b=>b.onclick=()=>{sh.remove();qStart(a,b.dataset.qc);});}
function qCfgSheet(){const c=QS.cfg();const sh=sheet(`<h2>Alertas de retiro</h2><label class="f">Días antes del vencimiento para retirar</label><input class="inp" id="cA" inputmode="numeric" value="${c.ant}"><div class="sub">Ej.: 2 = el producto se avisa para retirar 2 días antes de su fecha.</div><label class="f">Mostrar como "próximos" los que vencen en los siguientes (días)</label><input class="inp" id="cP" inputmode="numeric" value="${c.prox}"><div class="row" style="margin-top:14px"><div class="grow"></div><button class="btn pri" id="cOk">Guardar</button></div>`);
  sh.querySelector('#cOk').onclick=()=>{c.ant=Math.max(0,+sh.querySelector('#cA').value||0);c.prox=Math.max(1,+sh.querySelector('#cP').value||7);QS.setCfg(c);sh.remove();go('qhome');};}

  $('#main').innerHTML=`<h1 style="font-size:22px">¿Qué pasillo vas a revisar?</h1><div class="sub">Pistolea los productos de la góndola. A los que tengan fecha corta les cargas la fecha de vencimiento y la app te avisa cuándo retirarlos.</div>

  <div class="card">${A.map(a=>`<div class="act" data-qs="${a.id}"><div class="ic v">🧪</div><div class="grow"><div class="t">${esc(a.name)}</div><div class="s">${esc(a.desc||'')}</div></div><div class="ch">›</div></div>`).join('')}</div>`;
  const qc=$('#qCont');if(qc)qc.onclick=()=>{QREV=open;qScanUI();};
  $$('[data-qs]').forEach(e=>e.onclick=()=>{const a=A.find(x=>x.id===e.dataset.qs);const cls=srt(a.cats).filter(c=>CLS_CNT.get(c));
    $('#main').innerHTML=`<h1 style="font-size:22px">¿Qué vas a revisar?</h1><div class="sub">${esc(a.name)}</div>
    <label class="radio on" id="rAll"><input type="radio" name="sc" checked><div><b>Todo el pasillo</b></div></label>
    <label class="radio" id="rOne"><input type="radio" name="sc"><div class="grow"><b>Solo una clase</b><label class="f">Clase</label><select class="sel" id="sCls" disabled>${cls.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select></div></label>
    <div class="row" style="margin-top:12px"><button class="btn" id="sBack">Volver</button><button class="btn pri" id="sGo">Empezar</button></div>`;
    const upd=one=>{$('#rAll').classList.toggle('on',!one);$('#rOne').classList.toggle('on',one);$('#sCls').disabled=!one;};
    $('#rAll').onclick=()=>upd(false);$('#rOne').onclick=()=>upd(true);$('#sBack').onclick=()=>go('qscan');
    $('#sGo').onclick=()=>qStart(a,$('#rOne').classList.contains('on')?$('#sCls').value:null);});}
function qStart(a,c){QREV={id:uid(),aisleId:a.id,aisleName:a.name,cls:c,classes:c?[c]:[...a.cats],userId:ME.id,userName:ME.name,start:Date.now(),end:null,open:true,seen:{},lots:0,upd:Date.now()};
  const R=QS.revs();R.unshift(QREV);QS.setRevs(R);VIEW='qscan';qScanUI(true);}
function qSave(){QREV.upd=Date.now();const R=QS.revs();const i=R.findIndex(r=>r.id===QREV.id);if(i>=0)R[i]=QREV;else R.unshift(QREV);QS.setRevs(R);}
function qScanUI(auto){VIEW='qscan';$$('#navQ button').forEach(b=>b.classList.toggle('on',b.dataset.q==='qscan'));const r=QREV;const lots=QS.lots().filter(l=>l.revId===r.id);
  $('#main').innerHTML=`<div class="card" style="padding:10px 14px"><div style="font-weight:600">🧪 ${esc(r.aisleName)}</div>${r.cls?`<div style="color:var(--ora);font-size:12px">Solo la clase: ${esc(r.cls)}</div>`:''}<div class="sub">Revisión de fechas · ${fdt(r.start)}</div></div>
  <button class="btn pri big" id="qCam" style="padding:18px;font-size:18px">📷 Pistolear producto</button>
  <div class="row" style="margin:10px 0"><input class="inp grow" id="qMan" placeholder="Código manual" inputmode="numeric"><button class="btn pri" id="qAdd">Agregar</button></div>

  $('#qCam').onclick=camOnF;$('#qAdd').onclick=()=>{codeIn($('#qMan').value);$('#qMan').value='';};$('#qMan').onkeydown=e=>{if(e.key==='Enter'){codeIn(e.target.value);e.target.value='';}};
  $('#qCancel').onclick=()=>{if(!confirm('¿Cancelar esta revisión? Las fechas ya cargadas se mantienen.'))return;camOff();QS.setRevs(QS.revs().filter(x=>x.id!==r.id));QREV=null;go('qscan');};
  $('#qFin').onclick=qFinish;bindRet(()=>qScanUI());if(auto)camOnF();}
function qFinish(){camOff();$('#fs').classList.add('hide');const r=QREV;r.open=false;r.end=Date.now();r.lots=QS.lots().filter(l=>l.revId===r.id).length;qSave();QREV=null;
  toast('Revisión terminada: '+Object.keys(r.seen).length+' revisados, '+r.lots+' con fecha corta','ok',3500);go('qhome');}
function qCode(c){c=String(c||'').trim();if(!c||!QREV)return;const x=findCode(c);
  if(!x){fsInfo('⛔ Código '+c+' no está en la base','err');toast('⛔ Código '+c+' no está en la base','err');beep(220);return;}
  if(!QREV.classes.includes(x.cla)){fsInfo('⛔ No es de esta revisión: '+short(x.cla),'err');toast('⛔ "'+x.desc+'" es de '+x.cla,'err',4000);beep(220);vib([60,60,60]);return;}
  QREV.seen[x.sku]=Date.now();qSave();beep(1800);vib(70);const wasCam=!$('#fs').classList.contains('hide');if(wasCam){camOff();$('#fs').classList.add('hide');}
  const prev=QS.lots().filter(l=>l.sku===x.sku&&l.status!=='retirado');
  const sh=sheet(`<h2>${esc(x.desc)}</h2><div class="sub">${esc(short(x.cla))} · ${esc(x.gtin)} · OH ${fmt(x.oh)}</div>
   ${prev.length?`<div class="card sub" style="margin-top:8px">Ya tiene fecha(s) registrada(s): ${prev.map(l=>fdate(l.fv)).join(', ')}</div>`:''}

  const next=()=>{sh.remove();qScanUI(wasCam);};sh.querySelector('.x').onclick=next;
  sh.querySelector('#qNo').onclick=next;
  sh.querySelector('#qYes').onclick=()=>{const f=sh.querySelector('#qF').value;if(!f){toast('Elige la fecha de vencimiento','err');return;}
    const L=QS.lots();L.unshift({id:uid(),sku:x.sku,gtin:x.gtin,desc:x.desc,cla:x.cla,aisleId:QREV.aisleId,aisleName:QREV.aisleName,revId:QREV.id,fv:f,qty:+sh.querySelector('#qQ').value||0,userId:ME.id,userName:ME.name,created:Date.now(),status:'activo',upd:Date.now()});QS.setLots(L.slice(0,3000));
    const n=daysTo(f);toast(n<=QS.cfg().ant?'⚠️ Guardado: hay que retirarlo YA':'Fecha guardada · vence en '+n+' día(s)',n<=QS.cfg().ant?'err':'ok',3000);next();};}

$('#fileRep').onchange=async e=>{const files=[...e.target.files];e.target.value='';if(!files.length)return;const msg=t=>{const m=$('#dMsg');if(m)m.textContent=t;};const Pz=createParser(keepLocal,HOME_LOCAL);

    const rd=s.pipeThrough(new TextDecoderStream('windows-1252')).getReader();let buf='';
    for(;;){const{value,done}=await rd.read();if(done)break;buf+=value;let i;while((i=buf.indexOf('\n'))>=0){Pz.line(buf.slice(0,i));buf=buf.slice(i+1);}}if(buf)Pz.line(buf);}
    const db=Pz.result();if(!db.products.length)throw new Error('No se encontraron filas de '+HOME_LOCAL);await idbSet('db',db);setDB(db);msg('Listo: '+fmt(PR.length)+' productos. '+db.meta.rango);toast('Stock actualizado','ok');if(syncUrl()){LS.set('stockPend',Date.now());msg('Listo: '+fmt(PR.length)+' productos. Enviando a los demás celulares…');try{await pushStock();msg('Listo: '+fmt(PR.length)+' productos. Ya se envió a todos los celulares.');}catch(e2){msg('Listo en este celular. Se enviará a los demás apenas haya conexión.');}syncBadge();}
  }catch(err){msg('Error: '+err.message);toast('Error al cargar','err');}};

function assign(id){const L=S.aisles();const a=L.find(x=>x.id===id);const sel=new Set(a.cats);

      dc.push(...pc);clsOf.dep.set(dep,pc);hd+=`<details class="tree"><summary><input type="checkbox" data-k="dep" data-n="${esc(dep)}">${esc(dep)}<span class="n">${cnt(pc)}</span></summary>${hp}</details>`;}
    clsOf.div.set(div,dc);h+=`<details class="tree"><summary><input type="checkbox" data-k="div" data-n="${esc(div)}"><b>${esc(div)}</b><span class="n">${cnt(dc)}</span></summary>${hd}</details>`;}
  const sh=sheet(`<h2>Plan de ${esc(a.name)}</h2><div class="sub">Asignar por clase: marca clases enteras, o marca un subdepartamento, departamento o división para tomar todas sus clases. Solo cuentan los productos activos de ${esc(HOME_LOCAL)}.</div>

  $('#camOn').onclick=camOnF;$('#sAdd').onclick=()=>{scanCode($('#sMan').value);$('#sMan').value='';$('#sMan').focus();};

  $('#sCancel').onclick=()=>{if(!confirm('¿Cancelar esta recorrida? Se borra lo escaneado.'))return;camOff();S.setRecs(S.recs().filter(x=>x.id!==REC.id));REC=null;go('scan');};
  $('#sFin').onclick=finish;const hb=$('#sHand');if(hb)hb.onclick=handMark;renderPres();if(r._auto){delete r._auto;camOnF();}}
function handMark(){const r=REC;const L=planOf({cats:r.classes});
  const sh=sheet(`<h2>Marcar a mano</h2><div class="sub">Toca un producto para marcarlo como presente (igual que si lo pistolearas). Tócalo otra vez para quitarlo.</div><input class="inp" id="hQ" placeholder="Buscar por descripción, marca o código" style="margin:10px 0"><div id="hL"></div>`);
  const draw=()=>{const q=sh.querySelector('#hQ').value.trim().toLowerCase();const F=L.filter(x=>!q||(x.desc+' '+x.marca+' '+x.gtin+' '+x.sku).toLowerCase().includes(q)).sort((a,b)=>(!!r.scans[a.sku])-(!!r.scans[b.sku])||a.cla.localeCompare(b.cla)||a.desc.localeCompare(b.desc));
    sh.querySelector('#hL').innerHTML=F.slice(0,300).map(x=>`<div class="it" data-h="${esc(x.sku)}" style="cursor:pointer"><div style="font-size:20px;width:28px">${r.scans[x.sku]?'✅':'⬜'}</div><div class="grow"><div class="d">${esc(x.desc)}</div><div class="c">${esc(short(x.cla))} · ${esc(x.gtin||x.sku)}</div></div><span class="oh ${x.oh>0?'':'z'}">OH: ${fmt(x.oh)}</span><button class="btn sm" data-hp="${esc(x.sku)}" style="margin-left:6px" title="Stock físico">📝</button></div>`).join('')+(F.length>300?'<div class="sub">Mostrando 300 de '+fmt(F.length)+'. Usa el buscador.</div>':'');
    sh.querySelectorAll('[data-hp]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();prodSheet(b.dataset.hp);});sh.querySelectorAll('[data-h]').forEach(e=>e.onclick=()=>{const s=e.dataset.h;if(r.scans[s])delete r.scans[s];else r.scans[s]=Date.now();saveRec();renderPres();draw();});};
  sh.querySelector('#hQ').oninput=draw;draw();}
function renderPres(){const r=REC;const ks=Object.keys(r.scans).sort((a,b)=>r.scans[b]-r.scans[a]);$('#nSc').textContent=ks.length;
  const plan=planOf({cats:r.classes});$('#nPl').textContent=`de ${fmt(plan.length)} en el plan`;$('#nBar').style.width=Math.min(100,ks.length/Math.max(1,plan.length)*100)+'%';$('#nPr').textContent=ks.length+' producto(s)';
  $('#pres').innerHTML=ks.slice(0,60).map(k=>{const x=PR[BYSKU.get(k)];return x?`<div class="it"><div class="grow"><div class="d">${esc(x.desc)}</div><div class="c">${esc(x.gtin)} · ${esc(short(x.cla))}</div></div><span class="oh ${x.oh>0?'':'z'}">OH: ${fmt(x.oh)}</span></div>`:'';}).join('');}
function scanCode(c){c=String(c||'').trim();if(!c||!REC)return;const x=findCode(c);
  if(!x){toast('⛔ Código '+c+' no está en la base de '+HOME_LOCAL,'err',4000);fsInfo('⛔ Código '+c+' no está en la base','err');beep(220);return;}
  if(!REC.classes.includes(x.cla)){const where=aisleOfClass(x.cla).map(a=>a.name);
    toast(`⛔ No se registró: "${x.desc}" es de ${x.cla} y esta recorrida es ${REC.cls?'solo de '+REC.cls:'del pasillo '+REC.aisleName}${where.length?' (va en '+where.join(', ')+')':''}.`,'err',5000);
    fsInfo('⛔ No se registró: es de '+x.cla,'err');if(!REC.rej.includes(x.sku)){REC.rej.push(x.sku);saveRec();}beep(220);vib([60,60,60]);return;}
  if(REC.scans[x.sku]){toast('🔁 Ya registrado: '+x.desc,'info',1500);fsInfo('🔁 Ya registrado: '+x.desc,'info');return;}
  REC.scans[x.sku]=Date.now();saveRec();toast('✅ '+x.desc+(x.act?'':' (producto '+x.est.toLowerCase()+')'),'ok',1600);beep(1800);vib(70);fsInfo('✅ '+x.desc,'ok');if($('#pres'))renderPres();}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}
let actx;function beep(f){try{actx=actx||new AudioContext();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+(f<500?.25:.09));}catch(e){}}
/* cámara */
let stream=null,camRun=false,zx=null,lastC='',lastT=0;
function fsInfo(msg,cls){const Q=MODE==='cal'&&QREV&&VIEW==='qscan';if(!REC&&!Q)return;const X=Q?QREV:REC;$('#fsA').textContent=(Q?'🧪 ':'')+X.aisleName;$('#fsC').textContent=X.cls?'Solo la clase: '+X.cls:(X.aisleDesc||'Todo el pasillo');
  if(Q)$('#fsN').textContent=Object.keys(QREV.seen).length+' revisados · pistolea un producto para cargar su fecha';else{const n=Object.keys(REC.scans).length,pl=planOf({cats:REC.classes}).length;$('#fsN').textContent=`${n} escaneados de ${fmt(pl)} en el plan`;}
  if(msg){const e=$('#fsL');e.textContent=msg;e.style.background=cls==='err'?'rgba(220,38,38,.9)':cls==='ok'?'rgba(22,163,74,.85)':cls==='info'?'rgba(37,99,235,.85)':'rgba(0,0,0,.55)';}}
function fsClose(){camOff();$('#fs').classList.add('hide');if(MODE==='cal'&&QREV&&VIEW==='qscan'){qScanUI();return;}if(REC&&VIEW==='scan'&&$('#pres'))renderPres();}
$('#fsX').onclick=fsClose;$('#fsList').onclick=fsClose;$('#fsFin').onclick=()=>{$('#fs').classList.add('hide');if(MODE==='cal'&&QREV&&VIEW==='qscan')qFinish();else finish();};
$('#fsMan').onclick=()=>{$('#fsManW').classList.remove('hide');$('#fsIn').focus();};
$('#fsAdd').onclick=()=>{codeIn($('#fsIn').value);$('#fsIn').value='';$('#fsIn').focus();};$('#fsIn').onkeydown=e=>{if(e.key==='Enter')$('#fsAdd').click();};
async function camOnF(){const ok=c=>{const n=Date.now();if(c===lastC&&n-lastT<3000)return;lastC=c;lastT=n;codeIn(c);};
  $('#fs').classList.remove('hide');$('#fsManW').classList.add('hide');fsInfo('Iniciando cámara…');camRun=true;const cam={set innerHTML(h){fsInfo(h.replace(/<[^>]+>/g,' '),'err');}};
  try{if('BarcodeDetector' in window){const fm=await BarcodeDetector.getSupportedFormats();const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf'].filter(f=>fm.includes(f))});
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}});const v=$('#vid');v.srcObject=stream;await v.play();fsInfo('Apunta al código de barras del producto');
      const loop=async()=>{if(!camRun)return;try{const r=await det.detect(v);if(r.length)ok(r[0].rawValue);}catch(e){}if(camRun)setTimeout(loop,120);};loop();}
    else{if(!window.ZXing){fsInfo('Cargando lector…');await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js';s.onload=res;s.onerror=()=>rej(new Error('sin conexión para cargar el lector'));document.head.appendChild(s);});}
      zx=new ZXing.BrowserMultiFormatReader();fsInfo('Apunta al código de barras del producto');await zx.decodeFromConstraints({video:{facingMode:'environment'}},$('#vid'),r=>{if(r&&camRun)ok(r.getText());});stream=$('#vid').srcObject;}
  }catch(e){camRun=false;fsInfo('No se pudo usar la cámara ('+(e.message||e.name)+'). Toca "Agregar código manualmente".','err');$('#fsManW').classList.remove('hide');}}
function camOff(){camRun=false;try{$('#vid').srcObject=null;}catch(e){}try{zx&&zx.reset();}catch(e){}if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;}
function computeFalt(r){const plan=planOf({cats:r.classes});const falt=[];let pres=0;
  for(const x of plan){if(r.scans[x.sku]){pres++;continue;}falt.push({s:x.sku,d:x.desc,c:x.cla,oh:x.oh,v:+x.vel.toFixed(2)});}
  falt.sort((a,b)=>a.c.localeCompare(b.c)||b.v-a.v);return {falt,pres,plan:plan.length};}
function finish(){camOff();const r=REC;Object.assign(r,computeFalt(r));r.end=Date.now();r.open=false;saveRec();result(r);}
function result(r){const alm=r.falt.filter(f=>f.oh>0),sin=r.falt.filter(f=>f.oh<=0);const scn=Object.keys(r.scans).length;
  $('#main').innerHTML=`<div class="card" style="background:#f0fdf4">✅ Recorrida de <b>${esc(r.aisleName)}</b>${r.cls?' (solo la clase '+esc(r.cls)+')':''} finalizada.<br>Se detectaron <b>${r.falt.length}</b> producto(s) que faltan exhibir: <b style="color:#e11d48">${alm.length} con stock en almacén (¡a reponer!)</b> y ${sin.length} sin stock.</div>
  <div class="kp3"><div class="kpi"><div class="v">${scn}</div><div class="l">presentes</div></div><div class="kpi"><div class="v" style="color:#e11d48">${alm.length}</div><div class="l">en almacén</div></div><div class="kpi"><div class="v" style="color:var(--ora)">${sin.length}</div><div class="l">sin stock</div></div></div>
  <div class="sec">Faltantes — hay que reponer <a id="rCsv">⇣ CSV</a></div>${faltList(alm)}
  ${sin.length?`<details class="card"><summary><b>Sin stock en almacén (${sin.length})</b> <span class="sub">no están en góndola y el sistema tampoco tiene stock: pedir reposición</span></summary>${faltList(sin)}</details>`:''}
  ${r.rej.length?`<div class="card sub">⛔ ${r.rej.length} código(s) escaneado(s) no se registraron porque no son de esta recorrida.</div>`:''}
  <div class="row" style="flex-wrap:wrap;margin-top:12px"><button class="btn pri" id="rCont">📷 Seguir escaneando</button><button class="btn pri" id="rOther">Escanear otro pasillo</button><button class="btn" id="rHist">Ver historial</button><button class="btn" id="rShare">📤 WhatsApp</button></div>`;
  $('#rCont').onclick=()=>go('scan',{rec:r.id});$('#rOther').onclick=()=>{REC=null;go('scan');};$('#rHist').onclick=()=>go('hist');
  $('#rCsv').onclick=()=>csvRec(r);$('#rShare').onclick=()=>shareRec(r);}
function faltList(L){if(!L.length)return '<div class="empty">Nada por reponer 🎉</div>';let h='',cur=null;const cnt={};L.forEach(f=>cnt[f.c]=(cnt[f.c]||0)+1);
  for(const f of L){if(f.c!==cur){cur=f.c;h+=`<div class="clsH"><span>${esc(cur)}</span><span>${cnt[cur]}</span></div>`;}const x=PR[BYSKU.get(f.s)];
    h+=`<div class="it" data-sku="${esc(f.s)}"><div class="grow"><div class="d">${esc(f.d)}</div><div class="c">${esc(x?x.gtin:f.s)}${f.v?' · vende '+fmt(f.v,1)+'/día':''}</div></div><span class="oh ${f.oh>0?'':'z'}">OH: ${fmt(f.oh)}</span></div>`;}return h;}
function csvRec(r){csvDownload(`recorrida_${r.aisleName.replace(/\W+/g,'_')}_${new Date(r.start).toISOString().slice(0,10)}.csv`,[['Pasillo','Clase recorrida','Usuario','Inicio','Fin','Resultado','Clase','SKU','GTIN','Descripcion','OH'],
  ...r.falt.map(f=>{const x=PR[BYSKU.get(f.s)]||{};return [r.aisleName,r.cls||'Todo el pasillo',r.userName,fdt(r.start),r.end?fdt(r.end):'',f.oh>0?'En almacen - reponer':'Sin stock',f.c,f.s,x.gtin||'',f.d,f.oh];}),
  ...Object.keys(r.scans).map(k=>{const x=PR[BYSKU.get(k)]||{};return [r.aisleName,r.cls||'Todo el pasillo',r.userName,fdt(r.start),r.end?fdt(r.end):'','Presente',x.cla||'',k,x.gtin||'',x.desc||'',x.oh??''];})]);}
async function shareRec(r){const alm=r.falt.filter(f=>f.oh>0);let cur=null,t=`🛒 Recorrida ${r.aisleName}${r.cls?' ('+short(r.cls)+')':''} – ${r.userName} – ${fdt(r.end||Date.now())}\nPresentes: ${Object.keys(r.scans).length} · A reponer: ${alm.length}\n`;
  for(const f of alm){if(f.c!==cur){cur=f.c;t+=`\n*${short(cur)}*\n`;}t+=`• ${f.d} – OH ${fmt(f.oh)}\n`;}
  try{if(navigator.share){await navigator.share({text:t});return;}}catch(e){if(e.name==='AbortError')return;}
  try{await navigator.clipboard.writeText(t);toast('Lista copiada: pégala en WhatsApp','ok');}catch(e){window.open('https://wa.me/?text='+encodeURIComponent(t));}}

   <button class="btn sm" id="pClr" style="margin-top:12px">✕ Limpiar filtros</button></details>
  <details class="card"><summary class="row" style="cursor:pointer"><div class="ic off" style="width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#f3f4f6">⋯</div><div class="grow"><b>Más acciones</b><div class="sub">Importar y exportar</div></div></summary>
   <div class="row" style="margin-top:10px;flex-wrap:wrap">${isAdmin()?'<button class="btn sm" id="pImp">⇡ Cargar reporte GSTPROFUND</button>':''}<button class="btn sm" id="pExp">⇣ Exportar resultados CSV</button></div></details>

  const run=()=>{const q=PF.q.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();const qs=q.split(/\s+/).filter(Boolean);

let RP='pasillo',RA='',RD=7,RC='',RA2='',RDV='';

const perSel=()=>`<label class="f">Recorridas de</label><select class="sel" id="rD">${[[1,'Hoy'],[7,'Últimos 7 días'],[30,'Últimos 30 días'],[0,'Todo']].map(([v,l])=>`<option value="${v}" ${RD===v?'selected':''}>${l}</option>`).join('')}</select>`;
const aisSel=(all)=>`<label class="f">Pasillo</label><select class="sel" id="${all?'rA2':'rA'}">${all?'<option value="">Todos</option>':''}${S.aisles().map(a=>`<option value="${a.id}" ${(all?RA2:RA)===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>`;
function bindSel(){const d=$('#rD');if(d)d.onchange=()=>{RD=+d.value;repBody();};const a=$('#rA');if(a)a.onchange=()=>{RA=a.value;RC='';repBody();};const a2=$('#rA2');if(a2)a2.onchange=()=>{RA2=a2.value;repBody();};const dv=$('#rDv');if(dv)dv.onchange=()=>{RDV=dv.value;repBody();};const c=$('#rC');if(c)c.onchange=()=>{RC=c.value;repBody();};}
function recsIn(days){const lim=days?Date.now()-days*864e5:0;return S.recs().filter(r=>!r.open&&r.end>=lim);}
const catScope=()=>{const a=S.aisles().find(x=>x.id===RA2);let L=a&&RP!=='prov'?PR.filter(x=>a.cats.includes(x.cla)):PR;if(RDV&&RP!=='prov')L=L.filter(x=>x.div===RDV);return L;};
const divSel=()=>`<label class="f">División</label><select class="sel" id="rDv"><option value="">Todas</option>${[...new Set(PR.map(x=>x.div))].sort().map(d=>`<option value="${esc(d)}" ${RDV===d?'selected':''}>${esc(d)}</option>`).join('')}</select>`;
function repBody(){const B=$('#rBody');const A=S.aisles();let h='';
  const need=['pasillo','evo'].includes(RP)&&!A.length;if(need){B.innerHTML='<div class="card empty">Primero crea pasillos y haz recorridas.</div>';return;}
  if(RP==='pasillo'){const a=A.find(x=>x.id===RA)||A[0];RA=a.id;const L=latestByClass(RD);const rows=[];let pres=0,rep=0,tot=0;
    for(const c of srt(a.cats)){const n=CLS_CNT.get(c)||0;if(!n)continue;const r=L.get(a.id+'|'+c);
      if(!r){rows.push({c,n,r:null});continue;}const F=r.falt.filter(f=>f.c===c);const al=F.filter(f=>f.oh>0);const withStock=planOf({cats:[c]}).filter(x=>x.oh>0).length;const p=Math.max(0,withStock-al.length);
      pres+=p;rep+=al.length;tot+=withStock;rows.push({c,n,r,p,al,ws:withStock});}
    const nr=rows.filter(x=>!x.r).length;const cob=tot?Math.round(pres/tot*100):0;
    h=`<div class="card"><div class="row"><div class="grow">${aisSel(false)}</div><div class="grow">${perSel()}</div></div><div class="sub" style="margin-top:8px">Une todas las recorridas cerradas del pasillo en el período: sirve para ver el pasillo completo cuando lo recorriste clase por clase. Solo considera productos con stock en almacén (OH &gt; 0).</div></div>
    <div class="card"><b>Reporte de ${esc(a.name)}</b><div class="sub">${new Set([...L.values()].filter(r=>r.aisleId===a.id).map(r=>r.id)).size} recorrida(s) cerrada(s) · ${nr} clase(s) sin recorrer</div>
     <div class="kp3" style="margin-top:8px"><div class="kpi" style="background:#f6f7f6"><div class="v">${pres}</div><div class="l">presentes</div></div><div class="kpi" style="background:#f6f7f6"><div class="v" style="color:#e11d48">${rep}</div><div class="l">a reponer</div></div><div class="kpi" style="background:#f6f7f6"><div class="v">${cob}%</div><div class="l">cobertura</div></div></div></div>
    <div class="sec">Cobertura por clase</div><div class="card">${rows.sort((x,y)=>(!!y.r)-(!!x.r)).map(x=>x.r?`<details><summary style="cursor:pointer;padding:6px 0"><div class="row"><div class="grow" style="font-size:13px">${esc(x.c)}</div><span class="sub">${x.p}/${x.ws}</span> <span class="badge r">${x.al.length}</span> <b style="font-size:13px">${x.ws?Math.round(x.p/x.ws*100):100}%</b></div><div class="bar ${x.ws&&x.p/x.ws<.5?'r':''}"><i style="width:${x.ws?x.p/x.ws*100:100}%"></i></div><div class="sub" style="font-size:11px">${fdt(x.r.end)} · ${esc(x.r.userName)}</div></summary>${faltList(x.al)}</details>`:
      `<div class="row" style="padding:6px 0;font-size:13px;color:var(--mut)"><div class="grow">${esc(x.c)}</div>${x.n} · sin recorrer</div>`).join('')}</div>
    <button class="btn sm" id="rCsvP">⇣ CSV</button>`;}
  else if(RP==='repo'){const pend=pending(RD);const by=new Map();for(const p of pend){if(!by.has(p.a.id))by.set(p.a.id,{a:p.a,L:[]});by.get(p.a.id).L.push(p.f);}
    h=`<div class="card">${perSel()}<div class="sub" style="margin-top:8px">Por pasillo y clase, de la última recorrida de cada clase en el período: ${pend.length} producto(s) pendiente(s) en ${by.size} pasillo(s). Toca un pasillo para desglosarlo.</div></div>
    ${A.filter(a=>a.active!==false).map(a=>{const o=by.get(a.id);return `<details class="card"><summary class="row" style="cursor:pointer"><div class="grow"><b>${esc(a.name)}</b> <span class="sub">${esc(a.desc||'')}</span></div>${o?`<span class="badge o">${o.L.length} a reponer</span>`:'<span class="badge off">sin pendientes</span>'}</summary>${o?faltList(o.L.sort((x,y)=>x.c.localeCompare(y.c)||y.v-x.v)):''}</details>`;}).join('')}

    h=`<div class="card">${perSel()}<div class="sub" style="margin-top:8px">Productos que más veces quedaron sin exhibir (teniendo stock) en ${R.length} recorrida(s) cerrada(s).</div></div>

  else if(RP==='users'){const R=recsIn(RD);const m=new Map();for(const r of R){const o=m.get(r.userId)||{n:r.userName,rc:0,sc:0,rep:0,last:0};o.rc++;o.sc+=Object.keys(r.scans).length;o.rep+=r.falt.filter(f=>f.oh>0).length;o.last=Math.max(o.last,r.end);m.set(r.userId,o);}

     <div class="kp3" style="margin-top:6px;text-align:center"><div><div style="font-size:20px">${o.rc}</div><div class="sub">recorridas</div></div><div><div style="font-size:20px">${fmt(o.sc)}</div><div class="sub">escaneos</div></div><div><div style="font-size:20px;color:#e11d48">${o.rep}</div><div class="sub">a reponer</div></div></div></div>`).join('')||'<div class="card empty">Sin recorridas en el período</div>'}`;}
  else if(RP==='dias'){const R=recsIn(RD||30);const m=new Map();for(const r of R){const k=new Date(r.end).toISOString().slice(0,10);const o=m.get(k)||{k,rc:0,sc:0,rep:0,a:new Set()};o.rc++;o.sc+=Object.keys(r.scans).length;o.rep+=r.falt.filter(f=>f.oh>0).length;o.a.add(r.aisleName);m.set(k,o);}
    const L=[...m.values()].sort((a,b)=>b.k.localeCompare(a.k));const mx=Math.max(1,...L.map(o=>o.sc));
    h=`<div class="card">${perSel()}<div class="sub" style="margin-top:8px">Resumen día por día de todas las recorridas cerradas.</div></div>${L.map(o=>`<div class="card"><div class="row"><div class="grow"><b>${new Date(o.k+'T12:00').toLocaleDateString('es-PE',{weekday:'short',day:'2-digit',month:'2-digit'})}</b> <span class="sub">${o.rc} recorrida(s) · ${esc([...o.a].join(', '))}</span></div><span class="badge">${o.sc} escaneos</span></div><div class="bar"><i style="width:${o.sc/mx*100}%"></i></div><span class="badge o" style="margin-top:6px">${o.rep} a reponer</span></div>`).join('')||'<div class="card empty">Sin recorridas</div>'}`;}
  else if(RP==='comp'){const L=latestByClass(RD);const rows=A.filter(a=>a.active!==false).map(a=>{let ws=0,al=0,cl=0,rec=0;for(const c of a.cats){const r=L.get(a.id+'|'+c);if(!r)continue;rec++;const w=planOf({cats:[c]}).filter(x=>x.oh>0).length;ws+=w;al+=r.falt.filter(f=>f.c===c&&f.oh>0).length;}

  else if(RP==='evo'){const a=A.find(x=>x.id===RA)||A[0];RA=a.id;const cls=srt(a.cats).filter(c=>CLS_CNT.get(c));if(!cls.includes(RC))RC=cls[0]||'';

      return `<div class="card"><div class="row"><div class="grow"><b>${fdt(r.end)}</b> <span class="sub">${esc(r.userName)}</span></div><b>${c}%</b></div><div class="bar ${c<50?'r':''}"><i style="width:${c}%"></i></div><div class="sub" style="font-size:12px">${w} presentes · ${al} a reponer</div></div>`;}).join('')||'<div class="card empty">Sin recorridas de esa clase todavía.</div>'}`;}
  else{const X=catScope();const sc=RP==='prov'?'':`<div class="card">${aisSel(true)}${divSel()}</div>`;

      h=sc+`<div class="card"><b>Cobertura de stock</b><div class="sub">Días que dura el stock al ritmo de venta (${fmt(L.length)} productos activos con venta).</div><table class="t" style="margin-top:6px">${bk.map(([l,f])=>`<tr><td>${l}</td><td>${fmt(L.filter(f).length)}</td></tr>`).join('')}</table></div>

      h=sc+`<div class="card"><b>Pedidos sugeridos</b> — ${L.length} producto(s) con venta, sin OO ni transferencia, y cobertura menor a 1 semana.</div><div class="kp"><div class="kpi"><div class="v">${L.length}</div><div class="l">productos</div></div><div class="kpi"><div class="v">${fmt(L.reduce((s,o)=>s+o.q,0))}</div><div class="l">unidades a pedir</div></div></div><div class="sub" style="margin:6px 2px">Cantidad sugerida: lo que falta para cubrir 2 semanas de venta al ritmo promedio, redondeado a cajas.</div>${L.slice(0,100).map(o=>itRow(o.x,'pedir '+fmt(o.q))).join('')}`;}
    else if(RP==='valor'){const g=new Map();let T=0;for(const x of X){if(x.oh<=0)continue;const v=x.oh*x.cto;T+=v;g.set(x.dep,(g.get(x.dep)||0)+v);}const L=[...g].sort((a,b)=>b[1]-a[1]);
      h=sc+`<div class="card"><b>Valor del stock</b><div class="v" style="font-size:28px">${sol(T)}</div><div class="sub">a costo promedio, sin IGV</div></div><div class="card">${L.map(([k,v])=>`<div style="padding:5px 0"><div class="row" style="font-size:13px"><div class="grow">${esc(k)}</div><b>${sol(v)}</b></div><div class="bar"><i style="width:${v/L[0][1]*100}%"></i></div></div>`).join('')}</div>`;}
    else if(RP==='prov'){const g=new Map();let T=0;for(const x of PR){const o=g.get(x.prov)||{u:0,n:0,oh:0,v:0};o.u+=x.sold;o.n++;o.oh+=Math.max(0,x.oh);o.v+=x.sold*x.pv;g.set(x.prov,o);T+=x.sold;}const L=[...g].sort((a,b)=>b[1].u-a[1].u).slice(0,25);
      h=`<div class="card"><b>Proveedores</b> — ${g.size} proveedores · ${fmt(T)} unidades vendidas en ${DAYS} días · ${sol(L.reduce((s,[,o])=>s+o.v,0))} venta top 25.</div><div class="sec">Top 25 por unidades</div>${L.map(([k,o])=>`<div class="card" style="padding:10px 12px"><div class="row"><div class="grow" style="font-size:13px"><b>${esc(k)}</b></div><span class="sub">${(o.u/T*100).toFixed(1)}%</span> <b>${fmt(o.u)}</b></div><div class="bar"><i style="width:${o.u/L[0][1].u*100}%"></i></div><div class="sub" style="font-size:11px">${o.n} SKU · stock ${fmt(o.oh)} un</div></div>`).join('')}`;}
    else if(RP==='tend'){const g=new Map();for(const x of X){const o=g.get(x.cla)||{a:0,b:0};o.a+=x.w[0];o.b+=x.w[3];g.set(x.cla,o);}const L=[...g].filter(([,o])=>o.a>=20).map(([k,o])=>({k,...o,d:o.b-o.a,p:(o.b-o.a)/o.a})).sort((a,b)=>a.p-b.p);
      h=sc+`<div class="card"><b>Tendencia por clase</b> — ${L.filter(o=>o.d<0).length} clase(s) venden menos en la última semana completa que en la primera.<div class="sub">${esc(DB.meta.semanas[0]||'')} → ${esc(DB.meta.semanas[3]||'')}: suma de unidades vendidas por clase (peores caídas primero).</div></div>
      ${L.slice(0,60).map(o=>`<div class="card" style="padding:10px 12px"><div class="row"><div class="grow"><b style="font-size:13px">${esc(o.k)}</b><div class="sub" style="font-size:11px">${esc(aisleOfClass(o.k).map(a=>a.name).join(', '))} ${fmt(o.a)} → ${fmt(o.b)} un</div></div><b style="color:${o.d<0?'#e11d48':'var(--g)'}">${o.d>0?'+':''}${fmt(o.d)} (${o.p>0?'+':''}${(o.p*100).toFixed(1)}%)</b></div></div>`).join('')}`;}}
  B.innerHTML=h;bindSel();
  const cp=$('#rCsvP');if(cp)cp.onclick=()=>{const L=latestByClass(RD);const a=A.find(x=>x.id===RA);const rows=[['Pasillo','Clase','SKU','Descripcion','OH','Recorrida','Usuario']];for(const c of a.cats){const r=L.get(a.id+'|'+c);if(r)for(const f of r.falt)if(f.c===c&&f.oh>0)rows.push([a.name,c,f.s,f.d,f.oh,fdt(r.end),r.userName]);}csvDownload('reporte_'+a.name+'.csv',rows);};
  const cr=$('#rCsvR');if(cr)cr.onclick=()=>csvPending(pending(RD));
  const cn=$('#rCsvN');if(cn)cn.onclick=()=>{const L=catScope().filter(x=>x.oh<0&&!negExcl(x)).sort((a,b)=>a.oh-b.oh);csvDownload('oh_negativos_'+HOME_LOCAL+'.csv',[['Division','Departamento','Clase','SKU','GTIN','Descripcion','OH','Costo unit','Valor'],...L.map(x=>[x.div,x.dep,x.cla,x.sku,x.gtin,x.desc,x.oh,x.cto,(x.oh*x.cto).toFixed(2)])]);};}
function itRow(x,right){return `<div class="it" data-sku="${esc(x.sku)}"><div class="grow"><div class="d">${esc(x.desc)}</div><div class="c"><b>${esc(divCode(x.div))}</b> · ${esc(short(x.cla))} · OH ${fmt(x.oh)} · ${fmt(x.vel,1)}/día</div></div><span class="oh ${x.oh>0?'':'z'}">${esc(right)}</span></div>`;}

/* ================= arranque ================= */
(async()=>{try{const hm=location.hash.match(/[#&]s=([^&]+)/);if(hm){LS.set('syncUrl',decodeURIComponent(hm[1]));LS.set('syncSince',0);history.replaceState(null,'',location.pathname+location.search);}
  const BTS=+'__BUILDTS__'||0;let db=LS.get('stockUpd',0)<BTS?null:await idbGet('db');if(!db){db=await loadEmbedded();if(db){await idbSet('db',db);LS.set('stockUpd',Math.max(LS.get('stockUpd',0),BTS));}}if(!db&&syncUrl()){document.body.insertAdjacentHTML('beforeend','<div id="dlw" style="position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:99;font:16px system-ui;padding:30px;text-align:center">Descargando datos de la tienda…<br>la primera vez puede tardar unos segundos</div>');
    const r=await fetch(syncUrl()+(syncUrl().includes('?')?'&':'?')+'since=0');const j=await r.json();const st=(j.items||[]).filter(x=>x.k==='d'&&x.id==='stock').sort((a,b)=>b.upd-a.upd)[0];
    if(st&&st.d){db=await unB64(st.d);await idbSet('db',db);LS.set('stockUpd',st.upd);}
    const rest=(j.items||[]).filter(x=>x.k!=='d');if(rest.length)applyRemote(rest);const w=$('#dlw');if(w)w.remove();}
  if(!db)throw new Error(syncUrl()?'no hay stock cargado en la hoja':'abre el link completo que te compartió el administrador');setDB(db);
  const me=LS.get('me',null);const u=me&&S.users().find(x=>x.id===me&&!x.off);if(u){ME=u;startApp();}else showLogin();}
  catch(e){document.body.innerHTML='<div style="padding:30px">Error al cargar los datos: '+esc(e.message)+'</div>';}})();
</script>
